version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: node dist/main.js
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  worker-1:
    build: ./backend
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks
      WORKER_ID: worker-1
      POLL_INTERVAL_MS: "500"
      LEASE_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy

  worker-2:
    build: ./backend
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks
      WORKER_ID: worker-2
      POLL_INTERVAL_MS: "500"
      LEASE_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
